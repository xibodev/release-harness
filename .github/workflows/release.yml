name: Release Packages to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'release-harness-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate and pack without publishing)'
        required: false
        default: false
        type: boolean

jobs:
  test-and-publish:
    name: Test & Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: 1. Schemas Test
        run: npm run test:schemas

      - name: 2. Core Engine & Evaluator Tests
        run: npm run test:core

      - name: 3. 28 Neutral Acceptance Fixtures Suite
        run: npm run test:neutral

      - name: 4. Acceptance Suite (AC-01 through AC-18)
        run: npm run test:smoke

      - name: 5. Pack & Independent Consumer Test
        run: npm run test:install

      - name: 5. Build Release Tarballs
        run: |
          mkdir -p dist-tarballs
          npm pack --pack-destination dist-tarballs ./packages/release-harness-schemas
          npm pack --pack-destination dist-tarballs ./packages/release-harness-core
          npm pack --pack-destination dist-tarballs ./packages/release-harness

      - name: 6. Publish Packages to npm (Topological Order)
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Publishing @xibodev/release-harness-schemas..."
          cd packages/release-harness-schemas
          npm publish --access public --provenance
          
          echo "Publishing @xibodev/release-harness-core..."
          cd ../release-harness-core
          npm publish --access public --provenance
          
          echo "Publishing @xibodev/release-harness (Public Facade)..."
          cd ../release-harness
          npm publish --access public --provenance

      - name: 7. Create GitHub Release
        if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist-tarballs/*.tgz
          generate_release_notes: true
