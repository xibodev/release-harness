name: Release Packages to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
      - 'release-harness-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate and pack without publishing)'
        required: false
        default: false
        type: boolean

jobs:
  test-and-publish:
    name: Test & Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Validate public documentation
        run: npm run test:docs

      - name: Build public site allowlist
        run: npm run build:site

      - name: Validate schemas
        run: npm run test:schemas

      - name: Validate core, CLI, self-adoption and platform behavior
        run: npm run test:core

      - name: Pack and test an independent consumer
        run: npm run test:install

      - name: Build release tarballs
        run: |
          mkdir -p dist-tarballs
          npm pack --pack-destination dist-tarballs ./packages/release-harness-schemas
          npm pack --pack-destination dist-tarballs ./packages/release-harness-core
          npm pack --pack-destination dist-tarballs ./packages/release-harness

      - name: Publish packages to npm in dependency order
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "Publishing @xibodev/release-harness-schemas..."
          cd packages/release-harness-schemas
          npm publish --access public --provenance --tag beta
          
          echo "Publishing @xibodev/release-harness-core..."
          cd ../release-harness-core
          npm publish --access public --provenance --tag beta
          
          echo "Publishing @xibodev/release-harness (Public Facade)..."
          cd ../release-harness
          npm publish --access public --provenance --tag beta

      - name: Create GitHub release
        if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist-tarballs/*.tgz
          generate_release_notes: true
